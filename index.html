<style>

button{font:inherit;color:inherit;cursor:pointer}
.btn{min-height:48px;border-radius:12px;border:none;background:var(--accent);color:var(--btntxt);font-weight:700;padding:0 18px;font-size:16px}

.cell.l0{background:var(--c0)}.cell.l1{background:var(--c1)}.cell.l2{background:var(--c2)}.cell.l3{background:var(--c3)}.cell.l4{background:var(--c4);color:var(--btntxt)}

.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:3px}
.bar{height:12px;border-radius:6px;background:var(--c0);overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px}

svg.chart text{fill:var(--sub);font-size:10px}

.welcome{padding-top:18px}

<script>
(function(){
'use strict';
var KEY='ldl-tracker-v1';
var PLAN_DAYS=84;
var THRESH=80;

/* ---------- date helpers (local time) ---------- */
function pad(n){return n<10?'0'+n:''+n}
function fmt(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function parse(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function addDays(s,n){var d=parse(s);d.setDate(d.getDate()+n);return fmt(d)}
function diffDays(a,b){var x=parse(a),y=parse(b);return Math.round((Date.UTC(y.getFullYear(),y.getMonth(),y.getDate())-Date.UTC(x.getFullYear(),x.getMonth(),x.getDate()))/864e5)}
function todayStr(){return fmt(new Date())}
var WD=['日','一','二','三','四','五','六'];
function dowOf(s){return parse(s).getDay()}
function niceDate(s){var d=parse(s);return (d.getMonth()+1)+'/'+d.getDate()+'（週'+WD[d.getDay()]+'）'}
function md(s){var d=parse(s);return (d.getMonth()+1)+'/'+d.getDate()}
function validDate(s){return typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s)&&fmt(parse(s))===s}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

/* ---------- plan content ---------- */
var PHASES=[
 {name:'月 1　打底',weeks:'第 1–4 週',goal:'先把最傷血管的壞習慣拔掉，建立每天打勾的節奏。',
  points:['戒掉含糖飲料、油炸','早餐換成燕麥／全穀＋無糖豆漿','每天一小把堅果、每週 2 餐深海魚','有氧從 20 分鐘起步，步數 6000→7000','固定就寢與起床時間']},
 {name:'月 2　加強',weeks:'第 5–8 週',goal:'把降 LDL 最有效的飲食項目補齊，運動達到每週 150 分鐘。',
  points:['可溶性纖維 10 g 以上（天天）','豆製品取代部分肉類，認識植物固醇','加碼戒加工肉、甜點','有氧 30 分鐘，每週 150 分以上；肌力加重量','外食點餐策略：便當、夜市、火鍋']},
 {name:'月 3　鞏固',weeks:'第 9–12 週',goal:'把習慣變成日常，守住酒精與聚餐，第 12 週抽血驗收。',
  points:['酒精不超標','聚餐、過節的應對劇本','睡眠與壓力管理','有氧 35 分鐘、步數 9000','第 12 週抽血，帶著紀錄回診']}
];
var WEEKS=[
 '啟動週：把現況記下來（體重、LDL），先戒掉含糖飲料；手機放到床外充電。',
 '早餐大改造：每天燕麥／全穀＋無糖豆漿，奶油厚片、培根蛋餅、奶茶退場。',
 '油炸退場：鹹酥雞、炸雞排、薯條先放掉，改成蒸、烤、滷、燙；有氧升到 25 分鐘。',
 '好油上場：每天一小把堅果，本週吃 2 餐深海魚；月底回顧體重與睡眠。',
 '纖維加碼：可溶性纖維 10 g 以上（燕麥、豆類、秋葵、海帶、奇異果、芭樂）；有氧升到 30 分鐘。',
 '豆製品當主角：每週至少 4 餐以豆腐、豆干、毛豆取代肉；認識植物固醇；開始戒加工肉。',
 '肌力升級：加彈力帶或啞鈴；甜點歸零，想吃就水果。',
 '外食戰術週：便當去皮去肥、飯半碗菜加倍，夜市與火鍋的安全選項；月底回顧。',
 '酒精與聚餐：酒精不超標，練習聚餐前先吃、點餐不跟風；步數升到 9000。',
 '睡眠穩固：週末作息誤差 ≤ 1 小時；有氧升到 35 分鐘；找出最難守的兩項。',
 '維持與微調：為最難守的兩項想對策，把好習慣綁進固定流程（例如飯後散步）。',
 '驗收週：預約抽血（依醫師指示是否空腹），抽血前維持日常、不要臨時抱佛腳；整理紀錄準備回診。'
];
function weekOfIdx(i){return Math.min(12,Math.max(1,Math.floor(i/7)+1))}
function phaseOfWeek(w){return w<=4?0:(w<=8?1:2)}
function aeroMin(w){return w<=2?20:(w<=4?25:(w<=8?30:35))}
function stepGoal(w){return w<=2?6000:(w<=4?7000:(w<=8?8000:9000))}
function strMin(w){return w<=4?20:(w<=8?25:30)}
function aeroDay(dow){return dow===1||dow===3||dow===4||dow===6||dow===0}

var CATS={diet:'🥗 飲食',move:'🏃 運動',sleep:'😴 睡眠'};
function itemsFor(dateStr,idx){
  var w=weekOfIdx(idx),p=phaseOfWeek(w),dow=dowOf(dateStr);
  var it=[];
  it.push({id:'d1',cat:'diet',title:'早餐：燕麥／全穀 ＋ 無糖豆漿',
    det:'燕麥片約 40–80 g（沖泡或煮粥），或全麥吐司、地瓜。早餐店避開奶油厚片、培根蛋餅、鐵板麵、奶茶。'});
  it.push({id:'d2',cat:'diet',title:'蔬果 5 份 ＋ 可溶性纖維 10 g',
    det:(p===0?'先求蔬菜 3 份（1 份≈煮熟半碗）＋水果 2 份（1 份≈拳頭大），纖維盡量到 10 g。':'蔬菜 3 份＋水果 2 份，可溶性纖維要到 10 g 以上。')+'來源：燕麥、豆類、秋葵、海帶、木耳、奇異果、芭樂、柑橘。'});
  it.push({id:'d3',cat:'diet',title:'好蛋白 ＋ 一小把堅果',
    det:'主菜選豆腐、豆干、毛豆、深海魚（鮭魚、鯖魚、秋刀魚）、去皮雞肉；不吃肥肉、雞皮、豬皮、內臟。加一小把（約 20–30 g）原味無調味堅果。'+(p===0?'本月目標：每週 2 餐深海魚。':'每週至少 2 餐深海魚、4 餐豆製品。')});
  it.push({id:'d4',cat:'diet',title:p===0?'零含糖飲料':'零含糖飲料 ＋ 甜點',
    det:p===0?'手搖杯、汽水、果汁、含糖咖啡奶茶今天都不碰；改無糖茶、黑咖啡、白開水。':'含糖飲料、蛋糕、冰品、餅乾、酥皮點心今天都不碰；想吃甜的就吃水果。'});
  it.push({id:'d5',cat:'diet',title:p===0?'零油炸':(p===1?'零油炸 ＋ 加工肉':'零油炸、加工肉，酒精不超標'),
    det:p===0?'鹹酥雞、炸雞排、薯條、油條、天婦羅今天都不吃，改蒸、烤、滷、燙。':
        (p===1?'再加上香腸、熱狗、火腿、培根、貢丸、肉鬆。':'酒精最好不喝；要喝每天上限男 2 份、女 1 份（1 份＝啤酒 360 ml），且不要天天喝。')});
  if(aeroDay(dow)){
    it.push({id:'e1',cat:'move',title:'有氧運動 '+aeroMin(w)+' 分鐘',
      det:'快走、慢跑、騎車、游泳、爬坡皆可；中強度＝微喘、能說話但不能唱歌。可分 2 段完成。不舒服就改輕鬆散步。'});
  }else{
    it.push({id:'e1',cat:'move',title:'肌力訓練 '+strMin(w)+' 分鐘（每週 2 次）',
      det:w<=4?'徒手：深蹲、牆壁伏地挺身、棒式、臀橋，各 2–3 組，做 10–12 下。':(w<=8?'加彈力帶或水瓶／啞鈴：深蹲、划船、硬舉、肩推，各 3 組。':'中等重量，3 組 8–12 下，下肢＋上肢＋核心都要練。')});
  }
  it.push({id:'e2',cat:'move',title:'走滿 '+stepGoal(w).toLocaleString('en-US')+' 步',
    det:'含運動的步數，用手機健康 App 或手環查看。久坐每小時起來動 3 分鐘。'});
  it.push({id:'s1',cat:'sleep',title:'23:00 前上床，睡滿 7–8 小時',
    det:'早上固定時間起床（週末誤差 ≤ 1 小時），規律比補眠重要。'});
  it.push({id:'s2',cat:'sleep',title:'睡前 1 小時不滑手機、不看螢幕',
    det:'手機放到床外充電，改看紙本、伸展、泡腳或聽輕音樂。'});
  it.push({id:'s3',cat:'sleep',title:'下午 2 點後不碰咖啡因',
    det:'咖啡、茶（含手搖茶）、可樂、能量飲都算；想喝就選麥茶、無咖啡因花草茶或白開水。'});
  return it;
}

/* ---------- state ---------- */
var S=load();
var ui={tab:'today',view:null,toast:null,sel:'ldl'};
function blank(){return {ver:1,start:null,checks:{},weights:[],ldl:[],theme:'auto'}}
function load(){
  try{var r=window.localStorage.getItem(KEY);if(r){var o=sanitize(JSON.parse(r));if(o)return o}}catch(e){}
  return blank();
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('儲存失敗：瀏覽器空間不足或被封鎖')}}
function sanitize(o){
  if(!o||typeof o!=='object')return null;
  var r=blank();
  if(o.start!=null){if(!validDate(o.start))return null;r.start=o.start}
  if(o.checks&&typeof o.checks==='object'){
    Object.keys(o.checks).forEach(function(d){
      if(!validDate(d)||!o.checks[d]||typeof o.checks[d]!=='object')return;
      var m={};Object.keys(o.checks[d]).forEach(function(k){if(/^[a-z]\d$/.test(k)&&o.checks[d][k]===true)m[k]=true});
      if(Object.keys(m).length)r.checks[d]=m;
    });
  }
  function arr(a,lo,hi){
    if(!Array.isArray(a))return [];
    return a.filter(function(x){return x&&validDate(x.date)&&typeof x.val==='number'&&isFinite(x.val)&&x.val>=lo&&x.val<=hi})
      .map(function(x){return {date:x.date,val:Math.round(x.val*10)/10}});
  }
  r.weights=arr(o.weights,20,300);r.ldl=arr(o.ldl,20,500);
  if(o.theme==='light'||o.theme==='dark')r.theme=o.theme;
  return r;
}
function applyTheme(){
  var h=document.documentElement;
  if(S.theme==='light'||S.theme==='dark')h.setAttribute('data-theme',S.theme);else h.removeAttribute('data-theme');
}

/* ---------- computations ---------- */
function pctOf(dateStr){
  if(!S.start)return 0;
  var idx=diffDays(S.start,dateStr);
  var items=itemsFor(dateStr,Math.max(0,idx));
  var c=S.checks[dateStr]||{};
  var n=0;items.forEach(function(i){if(c[i.id])n++});
  return Math.round(n/items.length*100);
}
function lastPlanDay(){return addDays(S.start,PLAN_DAYS-1)}
function streakInfo(){
  var cur=0,best=0,done=0;
  if(!S.start)return {cur:0,best:0,done:0};
  var t=todayStr(),end=lastPlanDay();if(t<end)end=t;
  var n=diffDays(S.start,end);
  for(var i=0;i<=n;i++){
    var d=addDays(S.start,i),p=pctOf(d);
    if(p>=THRESH){cur++;done++;if(cur>best)best=cur}
    else if(d===t){/* today still pending: keep streak through yesterday */}
    else cur=0;
  }
  return {cur:cur,best:best,done:done};
}
function missedRun(){ // consecutive missed days ending yesterday
  var t=todayStr(),n=0,d=addDays(t,-1);
  while(S.start&&d>=S.start&&d<=lastPlanDay()&&pctOf(d)<THRESH){n++;d=addDays(d,-1)}
  return n;
}
function hash(s){var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h}
function pick(a,seed){return a[hash(seed)%a.length]}

var MSG={
 z:['今天還是 0%？LDL 163 不會自己乖乖掉下去喔，先勾一個最簡單的啦！','你的血管在等你耶，先把早餐燕麥解決，快！','再不開始，醫師就要開藥單給你了啦。','滑手機的時間拿來勾一個吧，不要說明天再說，明天也是這樣講。'],
 l:['才這樣而已？LDL 又沒有在放水，繼續啦！','進度不到一半，晚餐不要亂點鹹酥雞喔，我在看。','動起來啦，沙發不會幫你降膽固醇。','開始就好，現在不勾，睡前你會後悔。'],
 m:['過半了！但還沒 80%，連勝要 80% 才算數，衝一下！','差一點點而已，現在放棄太可惜，出去走個路啦。','還缺幾項，別讓今天白白漏氣。'],
 h:['穩！今天算數了，連勝 +1。剩下的別偷懶，湊滿 100% 啦！','80% 過關！不錯喔，但是 100% 才是真英雄。','今天有料，LDL 開始害怕了。'],
 f:['100%！太狠了，LDL 都在發抖。明天繼續，別得意忘形。','全勾！你是我見過最認真的人，保持下去！','滿分！今天的你，晚上可以睡得很安心。']
};
function messageFor(p,dateStr,streak){
  var b=p===0?'z':(p<50?'l':(p<THRESH?'m':(p<100?'h':'f')));
  var m=pick(MSG[b],dateStr+b);
  var cls=p>=THRESH?'good':'';
  var extra='';
  if(p<THRESH&&new Date().getHours()>=20)extra=' 都這麼晚了還沒達標，睡前至少補完能做的。';
  if(p>=THRESH&&streak>0&&streak%7===0)extra=' 連續 '+streak+' 天了，給你拍拍手，但不准鬆懈。';
  return {text:m+extra,cls:cls};
}

/* ---------- charts ---------- */
function lineChart(points,opt){
  if(!points.length)return '<p class="sub">還沒有紀錄，先登錄第一筆吧。</p>';
  var pts=points.slice().sort(function(a,b){return a.date<b.date?-1:(a.date>b.date?1:0)});
  var W=320,H=170,L=34,R=14,T=14,B=26;
  var vals=pts.map(function(p){return p.val});
  if(opt.target!=null)vals.push(opt.target);
  var lo=Math.min.apply(null,vals),hi=Math.max.apply(null,vals);
  var padv=Math.max((hi-lo)*0.15,opt.minPad||2);lo-=padv;hi+=padv;
  var t0=parse(pts[0].date).getTime(),t1=parse(pts[pts.length-1].date).getTime();
  function X(d){return pts.length===1||t1===t0?(L+(W-L-R)/2):L+(parse(d).getTime()-t0)/(t1-t0)*(W-L-R)}
  function Y(v){return T+(hi-v)/(hi-lo)*(H-T-B)}
  var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(opt.label)+'折線圖">';
  for(var g=0;g<=3;g++){
    var v=lo+(hi-lo)*g/3,y=Y(v);
    s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'" stroke="currentColor" stroke-opacity=".12"/>';
    s+='<text x="'+(L-4)+'" y="'+(y+3).toFixed(1)+'" text-anchor="end">'+Math.round(v)+'</text>';
  }
  if(opt.target!=null){
    var ty=Y(opt.target);
    s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+ty.toFixed(1)+'" y2="'+ty.toFixed(1)+'" stroke="#16a34a" stroke-dasharray="5 4" stroke-width="1.5"/>';
    s+='<text x="'+(W-R)+'" y="'+(ty-4).toFixed(1)+'" text-anchor="end" style="fill:#16a34a">目標 '+opt.target+'</text>';
  }
  var path=pts.map(function(p,i){return (i?'L':'M')+X(p.date).toFixed(1)+' '+Y(p.val).toFixed(1)}).join(' ');
  if(pts.length>1)s+='<path d="'+path+'" fill="none" stroke="'+opt.color+'" stroke-width="2.5" stroke-linejoin="round"/>';
  pts.forEach(function(p,i){
    var x=X(p.date),y=Y(p.val);
    s+='<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="4.5" fill="'+opt.color+'"><title>'+md(p.date)+'：'+p.val+'</title></circle>';
    if(i===0||i===pts.length-1||pts.length<=6)s+='<text x="'+x.toFixed(1)+'" y="'+(y-8).toFixed(1)+'" text-anchor="middle" style="fill:currentColor;font-weight:700">'+p.val+'</text>';
  });
  s+='<text x="'+L+'" y="'+(H-8)+'" text-anchor="start">'+md(pts[0].date)+'</text>';
  if(pts.length>1)s+='<text x="'+(W-R)+'" y="'+(H-8)+'" text-anchor="end">'+md(pts[pts.length-1].date)+'</text>';
  return s+'</svg>';
}

function ring(p){

  return '<div class="ringwrap"><svg viewBox="0 0 112 112"><circle cx="56" cy="56" r="'+r+'" fill="none" stroke="var(--c0)" stroke-width="12"/>'+
   '<circle cx="56" cy="56" r="'+r+'" fill="none" stroke="'+col+'" stroke-width="12" stroke-linecap="round" stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'"/></svg>'+
   '<div class="ringtxt"><span id="pct">'+p+'%</span><small>今日完成</small></div></div>';
}

  h+='</div>';
  h+='<div class="card"><h2>🥗 飲食重點</h2><ul class="b">'+
    '<li><b>飽和脂肪</b>：少吃肥肉、雞皮、豬皮、奶油、豬油、椰子油、全脂乳製品，占總熱量盡量 &lt; 7%。</li>'+
    '<li><b>反式脂肪</b>：越少越好，避開氫化植物油、酥皮點心、起酥麵包、市售油炸品、奶精、植物性奶油製品；買包裝食品看營養標示的「反式脂肪」要是 0。</li>'+
    '<li><b>可溶性纖維 10 g 以上／天</b>：燕麥、大麥、豆類（黃豆、黑豆、毛豆、鷹嘴豆）、秋葵、海帶、木耳、奇異果、芭樂、柑橘、蘋果。</li>'+
    '<li><b>燕麥</b>：每天約 40–80 g（乾燕麥片），β-葡聚醣有助降低 LDL。選純燕麥片，避開加糖即溶麥片。</li>'+
    '<li><b>豆製品</b>：豆腐、豆干、毛豆、無糖豆漿取代部分紅肉與加工肉。避開炸豆腐、百頁豆腐、豆皮若為油炸。</li>'+
    '<li><b>堅果</b>：每天一小把（約 20–30 g）原味無調味，如杏仁、核桃、腰果；熱量高，不要吃多。</li>'+
    '<li><b>深海魚</b>：每週 2 餐以上，鮭魚、鯖魚、秋刀魚、沙丁魚；用蒸、烤、煮，少煎炸。</li>'+
    '<li><b>植物固醇</b>：每天約 2 g 可再降 LDL 約 5–10%。天然來源有堅果、豆類、全穀、植物油；添加植物固醇的強化食品要先問醫師或營養師再吃。</li>'+
    '<li><b>蛋與內臟</b>：蛋可每天 1 顆內（蛋白不限），少吃內臟、魚卵、蝦卵、蟹黃；有糖尿病或已在治療者請依醫師建議。</li>'+
    '<li><b>限制</b>：加工肉（香腸、熱狗、火腿、培根、貢丸）、油炸、甜點、含糖飲料。</li>'+
    '<li><b>酒精</b>：最好不喝；要喝每天上限男 2 份、女 1 份（1 份＝啤酒 360 ml、紅酒 150 ml、烈酒 45 ml），一週至少 2 天不喝。</li>'+
    '<li>體重若過重，減 5–10% 對 LDL 與三酸甘油酯都有幫助，但不要極端節食。</li></ul></div>';
  h+='<div class="card"><h2>🍱 台灣外食換換看</h2><table><tr><th>場景</th><th>少碰</th><th>換成</th></tr>'+
    '<tr><td>早餐店</td><td>奶油厚片、培根蛋餅、鐵板麵、薯餅、奶茶</td><td>燕麥或全麥吐司、水煮蛋／茶葉蛋、無糖豆漿、地瓜、玉米、無糖茶</td></tr>'+
    '<tr><td>便當</td><td>炸排骨、炸雞腿、滷肉飯、肥滷肉汁</td><td>烤雞腿去皮、烤魚、滷豆腐豆干、蒸魚；菜加倍、飯半碗到八分、湯汁別淋飯</td></tr>'+
    '<tr><td>夜市</td><td>鹹酥雞、炸雞排、臭豆腐（炸）、蚵仔煎、大腸包小腸、甜不辣</td><td>烤玉米、烤魚、烤雞肉串（去皮）、清燙青菜、滷味選豆干／海帶／蔬菜（少貢丸、米血）、茶葉蛋</td></tr>'+
    '<tr><td>手搖飲</td><td>珍奶、含糖茶、奶蓋、果汁</td><td>無糖綠茶／烏龍、檸檬水（無糖）、黑咖啡、白開水</td></tr>'+
    '<tr><td>火鍋</td><td>麻辣鍋底、肉片（五花、牛小排）、加工火鍋料、油條、喝湯</td><td>清湯或昆布鍋、豆腐、菇類、大量蔬菜、海鮮、瘦肉；湯不喝、沾醬少放沙茶</td></tr>'+
    '<tr><td>麵店／小吃</td><td>乾麵加豬油、炸物配菜、肉羹、滷肉</td><td>清湯麵、燙青菜、滷蛋、豆干、海帶，麵量減半</td></tr>'+
    '<tr><td>下午茶／點心</td><td>蛋糕、餅乾、泡芙、冰品</td><td>水果、無調味堅果、無糖優格、無糖豆漿</td></tr></table></div>';
  h+='<div class="card"><h2>🏃 運動進程</h2>'+planTable()+
    '<ul class="b"><li>中強度＝微喘、能說話但不能唱歌（約 5–6/10 的用力程度）。</li><li>肌力：每週 2 次，不同日；先求動作標準再加重量。</li><li>步數包含運動走路。久坐每小時起來動 3 分鐘。</li><li>有心血管症狀、關節問題、或年紀大久未運動，開始前請先問醫師。</li></ul></div>';
  h+='<div class="card"><h2>😴 睡眠</h2><ul class="b">'+
    '<li>每天睡 7–8 小時，23:00 前上床，起床時間固定（週末誤差 ≤ 1 小時）。</li>'+
    '<li>睡前 1 小時不滑手機、不看螢幕，手機放床外充電。</li>'+
    '<li>下午 2 點後不碰咖啡因（咖啡、茶、可樂、能量飲）。</li>'+
    '<li>晚餐不要太晚、不要太撐，睡前 3 小時盡量不吃宵夜；睡前不喝酒（酒會破壞睡眠）。</li>'+
    '<li>睡眠不足會增加食慾與壓力荷爾蒙，進而影響體重與血脂。長期打呼、白天很想睡，請跟醫師談睡眠呼吸中止症。</li></ul></div>';
  h+='<div class="card"><h2>🩺 跟醫師討論</h2><ul class="b">'+
    '<li>開始前：把 LDL 163 的報告帶去，請醫師評估你的心血管風險與 LDL 目標。</li>'+
    '<li>確認有沒有其他原因（甲狀腺、肝腎、藥物、家族性高膽固醇）。</li>'+
    '<li>第 12 週：抽血複檢 LDL、HDL、三酸甘油酯、總膽固醇，帶著本 App 的紀錄（設定→匯出備份）回診。</li>'+
    '<li>生活型態做足仍未達標，醫師可能考慮藥物；已在服藥請不要自行停藥。</li></ul></div>';
  h+=disclaimer();
  return h;
}

function viewSettings(){
  var h='<h1>設定與備份</h1>';
  h+='<div class="card"><h2>計畫開始日</h2><label for="setStart">開始日（第 1 天）</label><input id="setStart" type="date" value="'+S.start+'">'+
    '<p class="small">計畫共 84 天，到 '+lastPlanDay()+' 結束。改日期不會刪除打勾紀錄，但各週對應會改變。</p>'+
    '<button class="btn" style="width:100%" data-act="savestart">更新開始日</button></div>';
  h+='<div class="card"><h2>外觀</h2><div class="seg" role="group" aria-label="外觀">'+
    ['auto:跟隨系統','light:淺色','dark:深色'].map(function(x){var p=x.split(':');return '<button data-act="theme" data-v="'+p[0]+'" aria-pressed="'+(S.theme===p[0])+'">'+p[1]+'</button>'}).join('')+'</div></div>';
  h+='<div class="card"><h2>備份（JSON）</h2><p class="small">資料只存在這支手機／這個瀏覽器，換機或清除資料前請先匯出。</p>'+
    '<div class="row wrap"><button class="btn" data-act="export">匯出備份檔</button><button class="btn sec" data-act="copyjson">複製備份文字</button></div>'+
    '<label for="importFile">匯入備份檔（會覆蓋目前資料）</label><input id="importFile" type="file" accept="application/json,.json">'+
    '<label for="importText">或貼上備份文字</label><textarea id="importText" placeholder="貼上備份 JSON"></textarea>'+
    '<button class="btn sec" style="width:100%;margin-top:8px" data-act="importtext">用貼上的文字匯入</button></div>';
  h+='<div class="card"><h2>重置</h2><p class="small">清除全部資料並重新開始。無法復原，請先匯出備份。</p><button class="btn danger" data-act="reset">清除所有資料</button></div>';
  return h;
}

var TABS=[['today','✅','今天'],['history','📅','歷史'],['logs','📈','數據'],['plan','📋','計畫'],['settings','⚙️','設定']];
function render(){
  var y=window.scrollY;
  applyTheme();
  var app=document.getElementById('app');
  if(!S.start){app.innerHTML=viewWelcome();return}
  var body=ui.tab==='today'?viewToday():ui.tab==='history'?viewHistory():ui.tab==='logs'?viewLogs():ui.tab==='plan'?viewPlan():viewSettings();
  app.innerHTML=body+'<nav class="tabbar" role="tablist"><div class="in">'+TABS.map(function(t){return '<button role="tab" data-act="tab" data-tab="'+t[0]+'" aria-selected="'+(ui.tab===t[0])+'"><span>'+t[1]+'</span>'+t[2]+'</button>'}).join('')+'</div></nav>';
  window.scrollTo(0,y);
}
var toastTimer;
function toast(m){
  var t=document.getElementById('toast');t.textContent=m;t.style.display='block';
  clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.style.display='none'},2600);
}

/* ---------- actions ---------- */
function exportData(){
  var blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ldl-tracker-backup-'+todayStr()+'.json';
  document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1000);
  toast('已匯出備份檔');
}
function doImport(text){
  var o;
  try{o=sanitize(JSON.parse(text))}catch(e){o=null}
  if(!o||!o.start){toast('匯入失敗：檔案格式不對');return}
  if(!confirm('匯入會覆蓋目前所有資料，確定嗎？'))return;
  S=o;save();ui.view=null;ui.tab='today';render();toast('匯入成功');
}
function numVal(id){var el=document.getElementById(id);return el?parseFloat(el.value):NaN}
function addLog(kind){
  var dId=kind==='ldl'?'ldlDate':'wDate',vId=kind==='ldl'?'ldlVal':'wVal';
  var d=document.getElementById(dId).value,v=numVal(vId);
  var lo=kind==='ldl'?20:20,hi=kind==='ldl'?500:300;
  if(!validDate(d)){toast('請選擇日期');return}
  if(!isFinite(v)||v<lo||v>hi){toast(kind==='ldl'?'LDL 請輸入 20–500 的數字':'體重請輸入 20–300 的數字');return}
  var arr=kind==='ldl'?S.ldl:S.weights;
  var ex=arr.filter(function(x){return x.date===d})[0];
  v=Math.round(v*10)/10;
  if(ex)ex.val=v;else arr.push({date:d,val:v});
  save();render();toast('已記錄 '+v+(kind==='ldl'?' mg/dL':' kg'));
}
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  var a=el.getAttribute('data-act');
  if(a==='begin'){
    var d=document.getElementById('startDate').value,l=numVal('baseLdl');
    if(!validDate(d)){toast('請選開始日');return}
    S.start=d;
    if(isFinite(l)&&l>=20&&l<=500)S.ldl.push({date:d,val:Math.round(l*10)/10});
    save();ui.view=null;ui.tab='today';render();
  }else if(a==='tab'){ui.tab=el.getAttribute('data-tab');render();window.scrollTo(0,0)}
  else if(a==='toggle'){
    var d2=ui.view||todayStr(),id=el.getAttribute('data-id');
    var c=S.checks[d2]||(S.checks[d2]={});
    if(c[id])delete c[id];else c[id]=true;
    if(!Object.keys(c).length)delete S.checks[d2];
    save();render();
  }
  else if(a==='prevday'){ui.view=addDays(ui.view||todayStr(),-1);render()}
  else if(a==='nextday'){var n=addDays(ui.view||todayStr(),1);ui.view=n>todayStr()?todayStr():n;render()}
  else if(a==='gotoday'){ui.view=null;render()}
  else if(a==='goday'){ui.view=el.getAttribute('data-date');ui.tab='today';render();window.scrollTo(0,0)}
  else if(a==='addldl')addLog('ldl');
  else if(a==='addweight')addLog('weight');
  else if(a==='dellog'){
    var arr=el.getAttribute('data-kind')==='ldl'?S.ldl:S.weights,i=+el.getAttribute('data-i');
    if(arr[i]&&confirm('刪除這筆紀錄？')){arr.splice(i,1);save();render()}
  }
  else if(a==='savestart'){
    var v=document.getElementById('setStart').value;
    if(!validDate(v)){toast('日期不正確');return}
    S.start=v;save();ui.view=null;render();toast('已更新開始日');
  }
  else if(a==='theme'){S.theme=el.getAttribute('data-v');save();render()}
  else if(a==='export')exportData();
  else if(a==='copyjson'){
    var txt=JSON.stringify(S);
    var done=function(){toast('已複製備份文字')};
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(done,function(){fallbackCopy(txt)});
    else fallbackCopy(txt);
  }
  else if(a==='importtext')doImport(document.getElementById('importText').value);
  else if(a==='reset'){
    if(confirm('真的要清除所有資料嗎？無法復原！')&&confirm('再確認一次：全部打勾、體重、LDL 紀錄都會消失。')){
      S=blank();save();ui.view=null;ui.tab='today';render();
    }
  }
});
function fallbackCopy(t){
  var ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');toast('已複製備份文字')}catch(e){toast('複製失敗，請改用匯出備份檔')}
  ta.remove();
}
document.addEventListener('change',function(e){
  if(e.target&&e.target.id==='importFile'){
    var f=e.target.files&&e.target.files[0];if(!f)return;
    var r=new FileReader();r.onload=function(){doImport(String(r.result))};
    r.onerror=function(){toast('讀取檔案失敗')};r.readAsText(f);
    e.target.value='';
  }
});
var lastDay=todayStr();
function checkRollover(){var t=todayStr();if(t!==lastDay){lastDay=t;ui.view=null;if(S.start)render()}}
setInterval(checkRollover,30000);
document.addEventListener('visibilitychange',function(){if(!document.hidden)checkRollover()});
render();
try{if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js')['catch'](function(){})}catch(e){}
})();
</script>
</body>
</html>
